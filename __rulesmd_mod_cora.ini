; ******* 计算机AI行为的IQ设置 *******
; 每个玩家（无论是否由计算机控制）都被赋予一个IQ等级，用于控制计算机可自动执行的操作。
; 此设置与难度设置不同。IQ等级越高，阵营的自主行为和智能程度越高。
; 每项能力都有一个对应的IQ阈值，只有当AI的IQ达到或超过该阈值时，才能获得这项能力。
; 由于这些能力由计算机自动执行，不建议给人类玩家控制的国家设置高IQ，
; 否则玩家的单位会开始自动"自作主张"！
; 人类控制的国家默认IQ等级为0，计算机控制的国家IQ等级为1或更高。
; 在遭遇战模式或多人游戏中启用AI时，计算机的IQ会被设为最大值。




