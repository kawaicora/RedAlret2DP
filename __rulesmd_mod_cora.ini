[SHAD] ; 黑鹰运输机
Landable=yes ; 可降落：是（允许该单位在地面降落，如放下步兵后落地）
PipScale=Passengers ; 状态pip显示类型：乘客数量（单位界面上用pip点显示当前搭载的乘客数）
Passengers=16 ; 最大搭载数量：5名步兵（该运输机可携带5个步兵单位）
Speed=16 ; 常规移动速度：14（空中巡航速度，单位为游戏内速度单位）
PitchSpeed=1.1 ; 俯仰速度：1.1（单位抬头/低头的速度，影响飞行姿态调整快慢）
JumpjetSpeed=30 ; 喷气跳跃模式速度：30（垂直起降/悬停时的移动速度，注释说明参数未单独定义时使用全局默认值）
JumpjetClimb=10 ; 喷气爬升速度：10（单位上升时的垂直速度）
JumpjetCrash=40 ; 喷气坠毁下降速度：40（注释说明为“向下爬升”，实际是单位坠毁时的垂直下落速度）
JumpJetAccel=12 ; 喷气加速率：12（单位从静止到达到最大喷气速度的加速度）
JumpJetTurnRate=6 ; 喷气转向速率：6（单位在喷气模式下的转向速度，数值越大转向越灵活）
JumpjetHeight=500 ; 喷气模式飞行高度：500（单位正常飞行时的海拔高度，游戏内高度单位）
JumpjetWobbles=.01 ; 喷气模式晃动幅度：0.01（飞行时的轻微晃动系数，数值越小越平稳）
JumpjetDeviation=1 ; 喷气模式偏移量：1（飞行路径的轻微偏移系数，影响飞行轨迹的平滑度）
ROT=10 ; 转向速率（Rate of Turn）：5（单位在常规模式下的转向速度，仅部分移动逻辑生效）
Crewed=yes ; 有乘员：是（单位被击毁时可能产生乘员逃生的逻辑，部分Mod中生效）
ConsideredAircraft=yes ; 视为飞行器：是（标记该单位为飞行器，影响防空武器的攻击判定）
Size=15 ; 单位体积大小：15（影响碰撞检测、能否通过狭窄区域，以及部分武器的伤害判定）
SizeLimit=15 ; 体积限制：2（可能用于运输舱位计算，或限制该单位进入某些运输载具的条件）
HoverAttack=yes ; 悬停攻击：是（单位可以在悬停状态下进行攻击，无需持续移动）
;OmniFire=yes ;GEF moved to weapon ; 注释：原设定的全向攻击（已移到武器定义中，当前单位不直接定义该属性）
AllowedToStartInMultiplayer=no ; 多人游戏初始可用：否（多人游戏开始时，玩家无法直接拥有该单位，需建造解锁）



